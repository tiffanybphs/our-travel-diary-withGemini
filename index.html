<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Travel Diary 🌸</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Zen Maru Gothic"', 'sans-serif'] },
                    colors: {
                        sakura: { light: '#FFF0F5', main: '#FFD1DC', dark: '#FFB7C5', text: '#D87093' },
                        cream: '#FFF9E3', cocoa: '#8B4513', sky: '#E0F2FE'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        body { background-color: #FFF9E3; color: #5D4037; -webkit-tap-highlight-color: transparent; }
        .splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: white url('splash.jpeg') no-repeat center center;
            background-size: cover;
            transition: opacity 0.8s ease;
        }
        .fade-out { opacity: 0; pointer-events: none; }
        
        /* 拖拽樣式 */
        .sortable-ghost { opacity: 0.3; background: #FFD1DC !important; }
        .sortable-drag { transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* 風琴式展開動畫 */
        .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; }
        
        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="app">
    <div :class="['splash-screen', { 'fade-out': !showSplash }]"></div>

    <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl pb-24 overflow-hidden">
        
        <header class="relative h-64">
            <img src="header-bg(1).jpg" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800'">
            <div class="absolute inset-0 bg-black/20"></div>
            
            <button @click="showSettings = true" class="absolute top-4 right-2 w-8 h-8 flex items-center justify-center bg-white/20 backdrop-blur-md rounded-full text-white transition active:scale-90">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>

            <div class="absolute bottom-12 left-6 text-white text-shadow">
                <h1 class="text-2xl font-bold tracking-widest">{{ trip.title || '我的櫻花之旅' }}</h1>
                <p class="text-xs mt-1 opacity-90">{{ trip.start_date }} ➜ {{ trip.end_date }}</p>
            </div>
        </header>

        <div class="relative -mt-10 bg-white rounded-t-[40px] px-4 pt-8 min-h-[500px]">
            
            <div class="flex justify-between px-2 mb-8 border-b border-gray-50 pb-4">
                <button v-for="t in tabs" :key="t.id" @click="currentTab = t.id" 
                        :class="['flex flex-col items-center gap-1', currentTab === t.id ? 'text-sakura-dark scale-105' : 'text-gray-300']">
                    <div :class="['w-10 h-10 rounded-full flex items-center justify-center transition-all', currentTab === t.id ? 'bg-sakura-light' : '']">
                        <i :class="['text-lg', t.icon]"></i>
                    </div>
                    <span class="text-[10px] font-bold">{{ t.name }}</span>
                </button>
            </div>

            <div v-if="currentTab === 'schedule'" ref="sortableContainer" class="space-y-4">
                <div v-if="!isConnected" class="text-center py-10 text-gray-300">
                    <p class="text-sm">請先點擊右上角 ⚙️ 連接資料庫</p>
                </div>
                
                <div v-for="(item, index) in schedules" :key="item.id" :data-id="item.id"
                     class="group bg-white border border-gray-100 p-4 rounded-2xl shadow-sm flex gap-4 items-start active:cursor-grabbing">
                    <div class="text-center min-w-[55px] pt-1">
                        <div class="font-bold text-gray-600 text-sm">{{ item.start_time }}</div>
                        <div class="text-[10px] text-gray-300 mt-1">{{ item.end_time }}</div>
                    </div>
                    
                    <div class="flex-1">
                        <div v-if="item.type === 'transport'" class="bg-sky/40 p-3 rounded-xl border border-sky-200">
                            <div class="text-blue-700 font-bold text-sm flex items-center">
                                <i class="fa-solid fa-train-subway mr-2"></i> {{ item.title }}
                            </div>
                        </div>
                        <div v-else>
                            <h4 class="font-bold text-gray-700 text-base mb-1">{{ item.title }}</h4>
                            <div class="flex items-center text-[11px] text-gray-400">
                                <i class="fa-solid fa-location-dot mr-1"></i> {{ item.location }}
                            </div>
                        </div>
                    </div>
                    <div class="pt-2 text-gray-200 handle cursor-grab">
                        <i class="fa-solid fa-grip-lines"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="fixed bottom-6 right-6 flex flex-col items-end gap-3 z-50">
            <transition name="fade">
                <div v-if="showAddMenu" class="flex flex-col gap-2 mb-2 animate-slide-up">
                    <button @click="openAddModal('activity')" class="bg-white text-sakura-dark px-4 py-2 rounded-full shadow-lg border border-sakura-light flex items-center gap-2 text-sm font-bold">
                        <i class="fa-solid fa-camera-retro"></i> 新增景點
                    </button>
                    <button @click="openAddModal('transport')" class="bg-white text-blue-400 px-4 py-2 rounded-full shadow-lg border border-blue-50 flex items-center gap-2 text-sm font-bold">
                        <i class="fa-solid fa-bus-simple"></i> 新增交通
                    </button>
                </div>
            </transition>
            <button @click="showAddMenu = !showAddMenu" 
                    :class="['w-14 h-14 rounded-full shadow-floating flex items-center justify-center text-2xl text-white transition-transform shadow-lg', showAddMenu ? 'bg-gray-400 rotate-45' : 'bg-sakura-main']">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div v-if="showSettings" class="fixed inset-0 z-[100] bg-black/40 backdrop-blur-sm flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-sm rounded-[30px] p-8 shadow-2xl relative">
                <button @click="showSettings = false" class="absolute top-6 right-6 text-gray-300"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h2 class="text-xl font-bold text-sakura-dark mb-6">連線設定</h2>
                <div class="space-y-4">
                    <input v-model="config.url" placeholder="Supabase URL" class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none text-sm">
                    <input v-model="config.key" type="password" placeholder="Anon Key" class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none text-sm">
                    <button @click="connectSupabase" class="w-full bg-sakura-main text-white py-3 rounded-full font-bold shadow-md active:scale-95 transition">儲存連線</button>
                    <p v-if="errorMsg" class="text-red-400 text-[10px] text-center">{{ errorMsg }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, onMounted, nextTick } = Vue;

createApp({
    setup() {
        const showSplash = ref(true);
        const showSettings = ref(false);
        const showAddMenu = ref(false);
        const isConnected = ref(false);
        const errorMsg = ref('');
        const config = ref({ url: localStorage.getItem('sb_url') || '', key: localStorage.getItem('sb_key') || '' });
        
        const trip = ref({ title: '櫻花季手帳', start_date: '2025-04-01', end_date: '2025-04-05' });
        const schedules = ref([]);
        const currentTab = ref('schedule');
        const tabs = [
            { id: 'schedule', name: '行程', icon: 'fa-solid fa-calendar-day' },
            { id: 'nav', name: '導航', icon: 'fa-solid fa-map-location-dot' },
            { id: 'voucher', name: '憑證', icon: 'fa-solid fa-ticket' },
            { id: 'list', name: '清單', icon: 'fa-solid fa-clipboard-check' },
            { id: 'money', name: '記帳', icon: 'fa-solid fa-yen-sign' }
        ];

        let supabase = null;

        const connectSupabase = async () => {
            const url = config.value.url.trim().replace(/\.+$/, '');
            const key = config.value.key.trim();
            if (!url || !key) return;

            try {
                supabase = window.supabase.createClient(url, key);
                const { data, error } = await supabase.from('trips').select('*').limit(1).single();
                if (error) throw error;
                
                trip.value = data;
                const { data: schData } = await supabase.from('schedules').select('*').order('sort_order');
                schedules.value = schData || [];
                
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
                isConnected.value = true;
                showSettings.value = false;
                initSortable();
            } catch (err) {
                errorMsg.value = '連線失敗，請檢查金鑰或 RLS 權限';
            }
        };

        const initSortable = () => {
            nextTick(() => {
                const el = document.querySelector('.space-y-4');
                if (!el) return;
                Sortable.create(el, {
                    animation: 150,
                    handle: '.handle',
                    ghostClass: 'sortable-ghost',
                    onEnd: async (evt) => {
                        const movedItem = schedules.value.splice(evt.oldIndex, 1)[0];
                        schedules.value.splice(evt.newIndex, 0, movedItem);
                        // 更新資料庫中的順序 (這裡僅更新 UI，實際需執行 update schedules set sort_order)
                    }
                });
            });
        };

        const openAddModal = (type) => {
            alert('進入新增 ' + (type === 'activity' ? '景點' : '交通') + ' 頁面 (開發中)');
            showAddMenu.value = false;
        };

        onMounted(() => {
            if (config.value.url && config.value.key) connectSupabase();
            setTimeout(() => { showSplash.value = false; }, 2500);
        });

        return { showSplash, showSettings, showAddMenu, isConnected, config, errorMsg, connectSupabase, trip, schedules, currentTab, tabs, openAddModal };
    }
}).mount('#app');
</script>
</body>
</html>
