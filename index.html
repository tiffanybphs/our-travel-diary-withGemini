<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 旅遊手帳 - Our Travel Diary</title>
    
    <meta name="theme-color" content="#FFD1DC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuedraggable@4.1.0/dist/vuedraggable.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: '#FFD1DC',
                        cream: '#FFF9E3',
                        powder: '#B0E0E6',
                        cocoa: '#8B5A2B',
                        sakuraDark: '#FFB6C1',
                        sakuraSoft: '#FFF0F3'
                    },
                    fontFamily: { zen: ['"Zen Maru Gothic"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #FFF9E3; color: #5C4033; overflow-x: hidden; }
        .sakura-card { border: 2px solid #FFD1DC; border-radius: 20px; background-color: #FFFDF9; box-shadow: 0 4px 10px rgba(255, 209, 220, 0.4); }
        .bg-header { background-image: url('header-bg(1).jpg'); background-size: cover; background-position: center; height: 260px; position: relative; }
        .negative-margin { margin-top: -45px; border-radius: 40px 40px 0 0; background-color: #FFF9E3; position: relative; z-index: 10; padding: 25px 15px; min-height: 80vh; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Accordion Animation */
        .accordion-content { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        .accordion-enter-from, .accordion-leave-to { max-height: 0; opacity: 0; }
        .accordion-enter-to, .accordion-leave-from { max-height: 1200px; opacity: 1; }

        /* Draggable visual feedback */
        .dragging-card { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255,182,193,0.6); z-index: 100; opacity: 0.9; }
        .ghost-card { opacity: 0.3; background: #FFD1DC !important; }

        /* Input Styles */
        input, select, textarea { border: 1.5px solid #FFD1DC; border-radius: 12px; padding: 8px 12px; background: #FFFDF9; }
        input:focus { border-color: #FFB6C1; outline: none; background: #FFF; }
        
        .toast-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px; z-index: 1000; }
    </style>
</head>
<body>

<div id="app">
    <div v-if="!isConfigured" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center p-6 bg-sakura" style="background-image: url('splash.jpeg'); background-size: cover;">
        <div class="bg-white/90 backdrop-blur p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold text-cocoa mb-6">🌸 旅遊手帳 🌸</h1>
            <input v-model="dbUrl" placeholder="Supabase URL" class="w-full mb-3">
            <input v-model="dbKey" placeholder="Anon Key" type="password" class="w-full mb-6">
            <button @click="saveDbConfig" class="w-full bg-sakuraDark text-white font-bold py-4 rounded-full shadow-lg">開始規劃旅程</button>
        </div>
    </div>

    <div v-else class="pb-24">
        <button @click="showConfig = true" class="fixed top-4 right-4 z-[60] w-10 h-10 bg-white/60 backdrop-blur rounded-full flex items-center justify-center shadow">
            <i class="fa-solid fa-gear text-cocoa"></i>
        </button>

        <header class="bg-header flex flex-col justify-end p-8 pb-16">
            <div class="bg-black/20 absolute inset-0"></div>
            <div class="relative z-10 text-white">
                <h1 class="text-3xl font-bold mb-1">{{ tripInfo.title || '我的日本之旅' }}</h1>
                <p class="text-sm opacity-90">{{ tripInfo.start_date }} ➜ {{ tripInfo.end_date }}</p>
            </div>
        </header>

        <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur shadow-sm flex overflow-x-auto no-scrollbar px-2 py-3">
            <button v-for="t in tabs" :key="t.id" @click="activeTab = t.id"
                class="flex-shrink-0 mx-1 px-5 py-2 rounded-full font-bold text-sm transition-all"
                :class="activeTab === t.id ? 'bg-sakura text-cocoa shadow-md' : 'text-gray-400'">
                <i :class="t.icon" class="mr-1"></i> {{ t.label }}
            </button>
        </nav>

        <main class="negative-margin">
            <div v-show="activeTab === 'schedule'">
                <div v-if="!tripInfo.start_date" class="text-center py-10">
                    <h2 class="font-bold text-lg mb-4">初次見面！請先設定日期</h2>
                    <input v-model="tempTrip.title" placeholder="旅行名稱" class="mb-2 w-full max-w-xs"><br>
                    <div class="flex justify-center gap-2 mb-4">
                        <input type="date" v-model="tempTrip.start" class="w-32">
                        <span class="py-2">➜</span>
                        <input type="date" v-model="tempTrip.end" class="w-32">
                    </div>
                    <button @click="initTrip" class="bg-sakuraDark text-white px-10 py-3 rounded-full font-bold">創建我的行程</button>
                </div>

                <div v-else>
                    <div class="flex overflow-x-auto no-scrollbar gap-2 mb-6">
                        <button v-for="day in tripDays" :key="day.date" @click="activeDate = day.date"
                            class="flex-shrink-0 px-4 py-2 rounded-2xl border-2 transition-all text-xs font-bold"
                            :class="activeDate === day.date ? 'bg-sakura border-sakuraDark text-cocoa' : 'border-sakura/30 text-gray-400'">
                            {{ day.label }}
                        </button>
                    </div>

                    <draggable v-model="dailyList" item-key="id" group="sched" :delay="1000" :delayOnTouchOnly="true"
                        @end="handleDragEnd" ghost-class="ghost-card" drag-class="dragging-card" class="space-y-4">
                        <template #item="{ element, index }">
                            <div class="relative">
                                <div v-if="index > 0 && showGap(index)" class="flex justify-center -my-2 relative z-0">
                                    <div class="bg-sakuraSoft border border-sakura text-[10px] px-3 py-1 rounded-full text-cocoa/70">
                                        行程間距：{{ calcGap(index) }} 分鐘
                                    </div>
                                </div>

                                <div class="sakura-card p-4 transition-all" :class="element.type === 'transport' ? 'bg-powder/10' : ''">
                                    <div v-if="!element.isEditing" @click="toggleEdit(element)">
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="text-[10px] font-bold bg-sakura/40 px-2 py-0.5 rounded-lg">{{ element.start_time }} - {{ element.end_time }}</span>
                                            <div class="flex gap-1">
                                                <span v-if="element.tag" class="text-[10px] px-2 py-0.5 rounded text-white font-bold" :class="tagColor(element.tag)">{{ element.tag }}</span>
                                                <i :class="typeIcon(element)" class="text-sakuraDark"></i>
                                            </div>
                                        </div>
                                        <h3 class="font-bold text-lg mb-1">{{ element.type === 'transport' ? element.from + ' ➜ ' + element.to : element.title }}</h3>
                                        <div v-if="element.location" class="flex items-center text-xs text-gray-500 mb-2">
                                            <i class="fa-solid fa-location-dot mr-1"></i> {{ element.location }}
                                            <button @click.stop="navTo(element.location)" class="ml-2 text-powder font-bold underline">導航</button>
                                        </div>
                                        
                                        <div v-if="element.type === 'transport' && element.segments?.length" class="mt-2 space-y-1">
                                            <div v-for="seg in element.segments" class="text-[11px] bg-white/60 p-2 rounded-lg flex items-center">
                                                <i :class="modeIcon(seg.mode)" class="mr-2 opacity-60"></i>
                                                <span>{{ seg.mode }} ({{ seg.route }}) : {{ seg.up }} ➜ {{ seg.down }}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div v-else class="accordion-content">
                                        <div class="grid grid-cols-2 gap-2 mb-3">
                                            <div>
                                                <label class="text-[10px] block mb-1 opacity-60">開始時間</label>
                                                <input v-model="element.start_time" inputmode="numeric" @blur="formatTime(element, 'start_time')" class="w-full text-sm">
                                            </div>
                                            <div>
                                                <label class="text-[10px] block mb-1 opacity-60">時長 (HH:mm)</label>
                                                <input v-model="element.duration" inputmode="numeric" @blur="formatTime(element, 'duration')" class="w-full text-sm">
                                            </div>
                                        </div>

                                        <div v-if="element.type === 'activity'">
                                            <input v-model="element.title" placeholder="活動名稱" class="w-full mb-2">
                                            <input v-model="element.location" placeholder="地點/Google Map網址" class="w-full mb-2 text-sm">
                                            <div class="flex gap-2 mb-2">
                                                <select v-model="element.category" class="w-1/2 text-sm">
                                                    <option>景點活動</option><option>吃喝</option><option>購物</option><option>集合地點</option>
                                                </select>
                                                <select v-model="element.tag" class="w-1/2 text-sm">
                                                    <option value="">無標籤</option><option>必吃</option><option>必買</option><option>必拍</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div v-else>
                                            <div class="flex gap-2 mb-2">
                                                <input v-model="element.from" placeholder="出發地" class="w-1/2">
                                                <input v-model="element.to" placeholder="目的地" class="w-1/2">
                                            </div>
                                            <div v-for="(seg, si) in element.segments" :key="si" class="bg-powder/5 p-2 rounded-xl mb-2 border border-powder/20">
                                                <select v-model="seg.mode" class="w-full text-xs mb-1">
                                                    <option v-for="m in transModes">{{ m }}</option>
                                                </select>
                                                <div class="grid grid-cols-2 gap-1">
                                                    <input v-model="seg.up" placeholder="上車點" class="text-xs">
                                                    <input v-model="seg.down" placeholder="下車點" class="text-xs">
                                                </div>
                                            </div>
                                            <button @click="addSegment(element)" class="text-[10px] text-powder font-bold">+ 新增轉乘分段</button>
                                        </div>

                                        <textarea v-model="element.notes" placeholder="備註..." class="w-full mt-2 text-xs h-16"></textarea>

                                        <div class="flex justify-between items-center mt-4">
                                            <button @click="removeSched(element.id)" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i> 刪除</button>
                                            <button @click="saveSched(element)" class="bg-sakuraDark text-white px-6 py-2 rounded-full font-bold shadow-md text-sm">儲存</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </draggable>

                    <div class="mt-10 border-t-2 border-dashed border-sakura/40 pt-6">
                        <h3 class="font-bold text-cocoa/60 text-sm mb-4 italic"><i class="fa-solid fa-clock-rotate-left"></i> 有待編入行程區</h3>
                        <draggable v-model="pendingList" item-key="id" group="sched" class="flex gap-3 overflow-x-auto no-scrollbar pb-4">
                            <template #item="{ element }">
                                <div class="flex-shrink-0 w-32 bg-white card-border p-3 text-xs opacity-70 rounded-xl" @click="toggleEdit(element)">
                                    <p class="font-bold truncate">{{ element.title || '交通' }}</p>
                                    <p class="opacity-60">{{ element.duration }}</p>
                                </div>
                            </template>
                        </draggable>
                    </div>
                </div>

                <button v-if="tripInfo.start_date" @click="showAddMenu = !showAddMenu" class="fixed bottom-24 right-6 w-14 h-14 bg-sakuraDark text-white rounded-full shadow-2xl z-50 flex items-center justify-center text-2xl transition-transform" :class="showAddMenu ? 'rotate-45' : ''">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <div v-if="showAddMenu" class="fixed bottom-40 right-6 flex flex-col gap-3 z-50">
                    <button @click="addQuick('activity')" class="bg-white border-2 border-sakura text-cocoa px-4 py-2 rounded-full font-bold text-sm shadow-lg">景點/活動</button>
                    <button @click="addQuick('transport')" class="bg-white border-2 border-powder text-cocoa px-4 py-2 rounded-full font-bold text-sm shadow-lg">交通</button>
                </div>
            </div>

            <div v-show="activeTab === 'list'">
                <div class="space-y-3">
                    <div v-for="li in shoppingList" :key="li.id" class="sakura-card p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" v-model="li.is_bought" @change="saveBuy(li)" class="w-6 h-6 border-sakura text-sakuraDark rounded-full">
                            <span :class="li.is_bought ? 'line-through opacity-40' : 'font-bold'">{{ li.name }}</span>
                        </div>
                        <button @click="saveBuy(li)" class="text-[10px] bg-sakura text-cocoa px-3 py-1 rounded-full font-bold">Save</button>
                    </div>
                </div>
                <button @click="promptList" class="fixed bottom-24 right-6 w-14 h-14 bg-sakuraDark text-white rounded-full shadow-2xl z-50 flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div v-show="activeTab === 'expenses'" id="expense-page">
                <div class="sakura-card p-6 mb-6">
                    <div class="flex justify-between items-end mb-6">
                        <div>
                            <p class="text-[10px] opacity-60">總支出預算估計</p>
                            <h2 class="text-3xl font-bold text-cocoa">HK$ {{ totalHKD }}</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] opacity-60">匯率 (JPY➜HKD)</p>
                            <input v-model="rate" inputmode="decimal" class="w-16 text-right font-bold border-b border-sakura bg-transparent">
                        </div>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex gap-2">
                            <input v-model="newExp.amount" placeholder="金額 (日元)" inputmode="numeric" class="w-2/3">
                            <select v-model="newExp.cat" class="w-1/3 text-xs">
                                <option>餐飲</option><option>交通</option><option>購物</option><option>住宿</option><option>門票</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <select v-model="newExp.pay" class="w-1/2 text-xs">
                                <option>電子支付</option><option>信用卡</option><option>現金</option>
                            </select>
                            <input v-model="newExp.notes" placeholder="備註" class="w-1/2">
                        </div>
                        <button @click="addExp" class="w-full bg-sakuraDark text-white font-bold py-3 rounded-xl shadow-md">新增支出</button>
                    </div>
                </div>

                <div class="sakura-card p-6 mb-10">
                    <canvas id="expenseChart" height="200"></canvas>
                </div>

                <div class="flex gap-2">
                    <button @click="exportExcel" class="flex-1 bg-white border-2 border-sakura py-3 rounded-2xl font-bold text-sm"><i class="fa-solid fa-file-excel mr-1"></i> Excel 匯出</button>
                    <button @click="exportPDF" class="flex-1 bg-white border-2 border-powder py-3 rounded-2xl font-bold text-sm"><i class="fa-solid fa-file-pdf mr-1"></i> PDF/截圖</button>
                </div>
            </div>

            <div v-show="activeTab === 'nav'">
                <div class="sakura-card p-6">
                    <h3 class="font-bold mb-4">地圖導航偏好</h3>
                    <div class="space-y-4">
                        <label class="flex items-center gap-3">
                            <input type="radio" v-model="mapPref" value="google" class="w-5 h-5">
                            <span class="font-bold">Google Maps (預設)</span>
                        </label>
                        <label class="flex items-center gap-3">
                            <input type="radio" v-model="mapPref" value="amap" class="w-5 h-5">
                            <span class="font-bold">高德地圖</span>
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-20 text-center opacity-30 text-[10px] py-10">
            🌸 Tiffany & Benjamin 🌸
        </footer>
    </div>

    <div v-if="showConfig" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">設定</h3>
            <p class="text-xs mb-1">Supabase URL</p>
            <input v-model="dbUrl" class="w-full mb-3 text-xs">
            <p class="text-xs mb-1">Anon Key</p>
            <input v-model="dbKey" type="password" class="w-full mb-6 text-xs">
            <button @click="saveDbConfig" class="w-full bg-sakuraDark text-white py-3 rounded-full mb-2">更新連線</button>
            <button @click="showConfig = false" class="w-full text-gray-400 text-xs py-2">關閉</button>
        </div>
    </div>

    <div v-if="toast" class="toast-msg font-bold">{{ toast }}</div>
</div>

<script>
const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

createApp({
    components: { draggable: window.vuedraggable },
    setup() {
        // --- State ---
        const isConfigured = ref(!!localStorage.getItem('sb_url'));
        const dbUrl = ref(localStorage.getItem('sb_url') || '');
        const dbKey = ref(localStorage.getItem('sb_key') || '');
        const showConfig = ref(false);
        const toast = ref('');
        const activeTab = ref('schedule');
        const activeDate = ref('');
        const mapPref = ref('google');
        const rate = ref(0.051); // JPY to HKD
        const showAddMenu = ref(false);

        const tripInfo = ref(JSON.parse(localStorage.getItem('tripInfo') || '{}'));
        const tempTrip = ref({ title: '', start: '', end: '' });
        const scheds = ref(JSON.parse(localStorage.getItem('scheds') || '[]'));
        const shoppingList = ref(JSON.parse(localStorage.getItem('shopping') || '[]'));
        const expenses = ref(JSON.parse(localStorage.getItem('expenses') || '[]'));
        const newExp = ref({ amount: '', cat: '餐飲', pay: '電子支付', notes: '' });

        const tabs = [
            { id: 'schedule', label: '行程', icon: 'fa-calendar-days' },
            { id: 'nav', label: '導航', icon: 'fa-location-arrow' },
            { id: 'list', label: '清單', icon: 'fa-list-check' },
            { id: 'expenses', label: '記帳', icon: 'fa-coins' }
        ];

        const transModes = ['步行', '地鐵', '捷運', '火車', '高鐵', '電車', '輕軌', '巴士', '小巴', '的士', '船', '飛機', '纜車', '其他'];

        // --- Computed ---
        const tripDays = computed(() => {
            if (!tripInfo.value.start_date) return [];
            let days = [];
            let curr = new Date(tripInfo.value.start_date);
            let end = new Date(tripInfo.value.end_date);
            const dStr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            while (curr <= end) {
                let m = (curr.getMonth() + 1).toString().padStart(2, '0');
                let d = curr.getDate().toString().padStart(2, '0');
                let day = dStr[curr.getDay()];
                days.push({ date: curr.toISOString().split('T')[0], label: `${m}.${d}(${day})` });
                curr.setDate(curr.getDate() + 1);
            }
            return days;
        });

        const dailyList = computed({
            get: () => scheds.value.filter(s => s.day_date === activeDate.value && !s.is_pending).sort((a,b) => a.order - b.order),
            set: (val) => {
                val.forEach((item, idx) => {
                    const original = scheds.value.find(s => s.id === item.id);
                    if (original) { original.order = idx; original.day_date = activeDate.value; original.is_pending = false; }
                });
                recalcChain(activeDate.value);
            }
        });

        const pendingList = computed({
            get: () => scheds.value.filter(s => s.is_pending).sort((a,b) => a.order - b.order),
            set: (val) => {
                val.forEach((item, idx) => {
                    const original = scheds.value.find(s => s.id === item.id);
                    if (original) { original.is_pending = true; original.order = idx; }
                });
            }
        });

        const totalHKD = computed(() => {
            const sum = expenses.value.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
            return (sum * rate.value).toFixed(2);
        });

        // --- Time Logic ---
        const timeToMin = (t) => {
            if (!t || !t.includes(':')) return 0;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };

        const minToTime = (min) => {
            const h = Math.floor(min / 60) % 24;
            const m = min % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        };

        const formatTime = (item, field) => {
            let val = item[field].replace(/\D/g, '');
            if (val.length === 4) {
                item[field] = `${val.slice(0,2)}:${val.slice(2,4)}`;
            }
            recalcChain(activeDate.value);
        };

        const recalcChain = (date) => {
            let list = scheds.value.filter(s => s.day_date === date && !s.is_pending).sort((a,b) => a.order - b.order);
            list.forEach((item, i) => {
                let start = timeToMin(item.start_time);
                let dur = timeToMin(item.duration);
                item.end_time = minToTime(start + dur);
                if (list[i+1]) {
                    list[i+1].start_time = item.end_time;
                }
            });
            saveLocal();
        };

        const showGap = (idx) => {
            const list = dailyList.value;
            return timeToMin(list[idx].start_time) > timeToMin(list[idx-1].end_time);
        };

        const calcGap = (idx) => {
            const list = dailyList.value;
            return timeToMin(list[idx].start_time) - timeToMin(list[idx-1].end_time);
        };

        // --- Methods ---
        const saveDbConfig = () => {
            localStorage.setItem('sb_url', dbUrl.value);
            localStorage.setItem('sb_key', dbKey.value);
            isConfigured.value = true;
            showConfig.value = false;
        };

        const initTrip = () => {
            tripInfo.value = { title: tempTrip.value.title, start_date: tempTrip.value.start, end_date: tempTrip.value.end };
            activeDate.value = tempTrip.value.start;
            saveLocal();
        };

        const addQuick = (type) => {
            const last = dailyList.value[dailyList.value.length - 1];
            const startTime = last ? last.end_time : "09:00";
            const newObj = {
                id: Date.now(),
                type,
                title: type === 'activity' ? '新活動' : '',
                from: '', to: '',
                start_time: startTime,
                duration: '01:00',
                end_time: minToTime(timeToMin(startTime) + 60),
                day_date: activeDate.value,
                is_pending: false,
                isEditing: true,
                order: dailyList.value.length,
                segments: type === 'transport' ? [{mode:'地鐵', up:'', down:'', route:''}] : []
            };
            scheds.value.push(newObj);
            showAddMenu.value = false;
            saveLocal();
        };

        const toggleEdit = (item) => {
            item.isEditing = !item.isEditing;
        };

        const saveSched = (item) => {
            if (!item.day_date) {
                item.is_pending = true;
                showToast("已存入待編入區");
            }
            item.isEditing = false;
            recalcChain(item.day_date);
            saveLocal();
        };

        const removeSched = (id) => {
            if (confirm("確定刪除？")) {
                scheds.value = scheds.value.filter(s => s.id !== id);
                saveLocal();
            }
        };

        const addSegment = (item) => {
            item.segments.push({mode:'步行', up:'', down:'', route:''});
        };

        const navTo = (loc) => {
            let url = mapPref.value === 'google' 
                ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`
                : `https://uri.amap.com/search?keyword=${encodeURIComponent(loc)}`;
            window.open(url, '_blank');
        };

        const promptList = () => {
            const name = prompt("想買什麼？");
            if (name) {
                shoppingList.value.push({ id: Date.now(), name, is_bought: false });
                saveLocal();
            }
        };

        const addExp = () => {
            if (!newExp.value.amount) return;
            expenses.value.push({
                id: Date.now(),
                amount: newExp.value.amount,
                category: newExp.value.cat,
                payment: newExp.value.pay,
                notes: newExp.value.notes
            });
            newExp.value = { amount: '', cat: '餐飲', pay: '電子支付', notes: '' };
            saveLocal();
            updateChart();
        };

        const saveLocal = () => {
            localStorage.setItem('tripInfo', JSON.stringify(tripInfo.value));
            localStorage.setItem('scheds', JSON.stringify(scheds.value));
            localStorage.setItem('shopping', JSON.stringify(shoppingList.value));
            localStorage.setItem('expenses', JSON.stringify(expenses.value));
        };

        const showToast = (msg) => {
            toast.value = msg;
            setTimeout(() => toast.value = '', 1500);
        };

        const tagColor = (t) => {
            if (t === '必吃') return 'bg-orange-400';
            if (t === '必買') return 'bg-pink-400';
            if (t === '必拍') return 'bg-purple-400';
            return 'bg-gray-400';
        };

        const typeIcon = (e) => e.type === 'transport' ? 'fa-solid fa-train-subway' : 'fa-solid fa-camera-retro';
        const modeIcon = (m) => {
            const icons = { '步行': 'fa-person-walking', '飛機': 'fa-plane', '地鐵': 'fa-train-subway', '的士': 'fa-taxi' };
            return 'fa-solid ' + (icons[m] || 'fa-ellipsis');
        };

        // --- Chart & Exports ---
        let chart = null;
        const updateChart = () => {
            nextTick(() => {
                const ctx = document.getElementById('expenseChart');
                if (!ctx) return;
                const data = {
                    labels: ['餐飲', '交通', '購物', '住宿', '門票'],
                    datasets: [{
                        data: ['餐飲', '交通', '購物', '住宿', '門票'].map(c => 
                            expenses.value.filter(e => e.category === c).reduce((a, b) => a + Number(b.amount), 0)
                        ),
                        backgroundColor: ['#FFD1DC', '#B0E0E6', '#FFF9E3', '#FFB6C1', '#8B5A2B']
                    }]
                };
                if (chart) chart.destroy();
                chart = new Chart(ctx, { type: 'doughnut', data, options: { plugins: { legend: { position: 'bottom' } } } });
            });
        };

        const exportExcel = () => {
            // Excel Logic (15 min intervals as per SPEC)
            const wb = XLSX.utils.book_new();
            const days = tripDays.value;
            const rows = [['時間', ...days.map(d => d.label)]];
            
            for (let i = 0; i < 96; i++) {
                const time = minToTime(i * 15);
                const r = [time];
                days.forEach(d => {
                    const isRest = (i < 40 || i >= 84); // 00:00-10:00, 21:00-00:00
                    r.push({ v: '', s: isRest ? { fill: { fgColor: { rgb: "EFEFEF" } } } : {} });
                });
                rows.push(r);
            }

            const ws = XLSX.utils.aoa_to_sheet(rows);
            // ... (Merge logic for durations would be here)
            XLSX.utils.book_append_sheet(wb, ws, "行程表");
            XLSX.writeFile(wb, "Travel_Diary.xlsx");
        };

        const exportPDF = () => {
            const el = document.getElementById('expense-page');
            html2pdf().from(el).set({ margin: 10, filename: 'Expenses.pdf' }).save();
        };

        onMounted(() => {
            if (tripDays.value.length) activeDate.value = tripDays.value[0].date;
            if (activeTab.value === 'expenses') updateChart();
        });

        watch(activeTab, (v) => { if(v === 'expenses') updateChart(); });

        return {
            isConfigured, dbUrl, dbKey, showConfig, saveDbConfig, activeTab, tabs, tripInfo, tempTrip, initTrip, tripDays, activeDate, dailyList, pendingList,
            addQuick, toggleEdit, saveSched, removeSched, addSegment, formatTime, showGap, calcGap, navTo, mapPref, transModes, tagColor, typeIcon, modeIcon,
            shoppingList, promptList, expenses, newExp, addExp, totalHKD, rate, exportExcel, exportPDF, toast, showAddMenu
        };
    }
}).mount('#app');
</script>
</body>
</html>
