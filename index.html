<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 Our Travel Diary | 旅遊手帳</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuedraggable@4.1.0/dist/vuedraggable.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: '#FFD1DC',
                        sakuraDeep: '#FFB6C1',
                        paper: '#FFFCF5',
                        blueSky: '#E0F2FE',
                        cocoa: '#5D4037'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #FFF9F2; color: #5D4037; overflow-x: hidden; }
        
        /* 導航欄瘦身 */
        .main-nav { height: 65px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
        
        /* 手帳卡片層次 */
        .card-activity { 
            background: #FFFFFF; 
            border: 1.5px solid #FFD1DC; 
            border-left: 8px solid #FFD1DC;
            box-shadow: 2px 4px 12px rgba(255, 182, 193, 0.15); 
        }
        .card-transport { 
            background: #F0F9FF; 
            border: 1.5px solid #BAE6FD; 
            border-left: 8px solid #BAE6FD;
        }
        
        /* 日期按鈕修正：確保不被遮擋 */
        .date-tabs-container { padding-top: 10px; margin-bottom: 15px; }
        .negative-content { margin-top: -20px; border-radius: 30px 30px 0 0; position: relative; z-index: 10; padding: 20px 15px; }

        /* 櫻花裝飾 */
        .sakura-bg { background-image: radial-gradient(#FFD1DC 1px, transparent 1px); background-size: 20px 20px; }
        
        input, select, textarea { 
            border: 1px solid #FFD1DC !important; 
            border-radius: 12px !important; 
            padding: 8px 12px !important;
            font-size: 13px !important;
        }
        .washi-tape {
            position: absolute; top: -10px; right: 20px; width: 60px; height: 20px;
            background: rgba(255, 182, 193, 0.4); transform: rotate(5deg);
        }
    </style>
</head>
<body class="sakura-bg">

<div id="app">
    <div v-if="!isConfigured" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-sakura/20">
        <div class="bg-white rounded-[35px] p-8 shadow-2xl w-full max-w-sm text-center border-4 border-white">
            <h1 class="text-xl font-bold text-sakuraDeep mb-6">連接資料庫 🌸</h1>
            <input v-model="dbUrl" placeholder="Supabase URL" class="w-full mb-3">
            <input v-model="dbKey" type="password" placeholder="Anon Key" class="w-full mb-6">
            <button @click="saveConfig" class="w-full bg-sakuraDeep text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">確認連線</button>
        </div>
    </div>

    <div v-else class="min-h-screen">
        <header class="h-[180px] relative flex flex-col justify-end p-6 pb-12 overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-t from-[#FFF9F2] to-transparent"></div>
            <img src="header-bg(1).jpg" class="absolute inset-0 w-full h-full object-cover -z-10 opacity-60">
            <h1 class="text-3xl font-bold drop-shadow-sm">{{ tripInfo.title || '我的首爾之旅' }}</h1>
            <p class="text-xs opacity-60">{{ tripInfo.start_date }} ~ {{ tripInfo.end_date }}</p>
        </header>

        <nav class="sticky top-0 z-50 main-nav border-b border-sakura/20 flex justify-around items-center px-4">
            <button v-for="t in tabs" :key="t.id" @click="activeTab = t.id"
                class="flex flex-col items-center transition-all"
                :class="activeTab === t.id ? 'text-sakuraDeep' : 'text-gray-300'">
                <i :class="[t.icon, 'text-base mb-0.5']"></i>
                <span class="text-[10px] font-bold">{{ t.label }}</span>
            </button>
        </nav>

        <main class="negative-content bg-[#FFF9F2]">
            
            <div v-show="activeTab === 'schedule'">
                <div class="date-tabs-container flex overflow-x-auto no-scrollbar gap-2">
                    <button v-for="day in tripDays" :key="day.date" @click="activeDate = day.date"
                        class="flex-shrink-0 px-5 py-2 rounded-2xl text-[11px] font-bold border transition-all"
                        :class="activeDate === day.date ? 'bg-sakuraDeep text-white border-sakuraDeep shadow-md' : 'bg-white text-gray-400 border-sakura/30'">
                        {{ day.label }}
                    </button>
                </div>

                <draggable v-model="dailyScheds" item-key="id" @end="onDragEnd" 
                    handle=".drag-handle" ghost-class="opacity-30" class="space-y-4 mt-4 pb-32">
                    <template #item="{ element, index }">
                        <div class="relative">
                            <div v-if="index > 0 && hasGap(index)" class="text-center -my-2 opacity-30 text-[9px] font-bold">
                                ⏱️ 間隔 {{ getGap(index) }} 分鐘
                            </div>

                            <div :class="['rounded-[22px] p-4 relative overflow-hidden', element.type === 'transport' ? 'card-transport' : 'card-activity shadow-sm']">
                                <div class="drag-handle washi-tape"></div>
                                
                                <div v-if="!element.isEditing" @click="element.isEditing = true">
                                    <div class="flex justify-between items-start mb-2">
                                        <div class="bg-white/80 px-2 py-0.5 rounded-lg text-[10px] font-bold border border-sakura/20 shadow-sm">
                                            {{ element.start_time }} - {{ element.end_time }} ({{ element.duration }}h)
                                        </div>
                                        <i :class="typeIcon(element)" class="text-sakuraDeep opacity-60"></i>
                                    </div>
                                    
                                    <h3 class="font-bold text-lg mb-1">{{ element.type === 'transport' ? `${element.from} ➜ ${element.to}` : element.title }}</h3>
                                    
                                    <div class="grid grid-cols-2 gap-y-1 text-[11px] opacity-70">
                                        <div v-if="element.area"><i class="fa-solid fa-map-pin mr-1"></i>{{ element.area }}</div>
                                        <div v-if="element.photo_ref"><i class="fa-solid fa-image mr-1"></i>#{{ element.photo_ref }}</div>
                                        <div v-if="element.location" class="col-span-2 text-blue-500 font-bold">
                                            <i class="fa-solid fa-location-dot mr-1"></i>{{ element.location }}
                                            <span class="underline ml-1">地圖</span>
                                        </div>
                                    </div>
                                    
                                    <div v-if="element.type === 'transport' && element.segments?.length" class="mt-2 space-y-1">
                                        <div v-for="s in element.segments" class="text-[10px] bg-white/40 p-1.5 rounded-xl border border-blue-100">
                                            🚆 {{ s.mode }} | {{ s.up }} ➜ {{ s.down }}
                                        </div>
                                    </div>
                                </div>

                                <div v-else class="space-y-3 pt-2">
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="text-[9px] font-bold opacity-40">開始時間 (如 0900)</label>
                                            <input v-model="element.start_time" @blur="formatTime(element, 'start_time')" class="w-full">
                                        </div>
                                        <div>
                                            <label class="text-[9px] font-bold opacity-40">時長 (如 0130)</label>
                                            <input v-model="element.duration" @blur="formatTime(element, 'duration')" class="w-full">
                                        </div>
                                    </div>

                                    <template v-if="element.type === 'activity'">
                                        <input v-model="element.title" placeholder="行程名稱 (必填)" class="w-full font-bold">
                                        <div class="grid grid-cols-2 gap-2">
                                            <input v-model="element.area" placeholder="區域 / 商圈" class="w-full">
                                            <input v-model="element.photo_ref" placeholder="照片參考編號" class="w-full">
                                        </div>
                                        <input v-model="element.location" placeholder="詳細地點名稱" class="w-full">
                                        <input v-model="element.google_map_url" placeholder="Google Map 網址" class="w-full">
                                        <div class="grid grid-cols-2 gap-2">
                                            <select v-model="element.category" class="w-full">
                                                <option>景點活動</option><option>美食吃喝</option><option>購物行程</option><option>飯店住宿</option>
                                            </select>
                                            <input v-model="element.biz_hours" placeholder="營業時間 (如 10:00-22:00)" class="w-full">
                                        </div>
                                        <input v-model="element.target" placeholder="此站目標 (如: 買到限定球鞋)" class="w-full">
                                    </template>

                                    <template v-else>
                                        <div class="flex gap-2">
                                            <input v-model="element.from" placeholder="起始點" class="w-1/2 font-bold">
                                            <input v-model="element.to" placeholder="目的地" class="w-1/2 font-bold">
                                        </div>
                                        <div v-for="(seg, si) in element.segments" :key="si" class="p-3 bg-white/50 rounded-2xl border border-blue-200 relative">
                                            <button @click="element.segments.splice(si, 1)" class="absolute top-1 right-2 text-xs opacity-20">✕</button>
                                            <select v-model="seg.mode" class="w-full mb-2">
                                                <option>地鐵</option><option>步行</option><option>巴士</option><option>的士</option>
                                            </select>
                                            <div class="flex gap-1">
                                                <input v-model="seg.up" placeholder="上車點" class="w-1/2 text-[10px]">
                                                <input v-model="seg.down" placeholder="下車點" class="w-1/2 text-[10px]">
                                            </div>
                                        </div>
                                        <button @click="element.segments.push({mode:'地鐵', up:'', down:''})" class="text-[11px] font-bold text-blue-500">+ 新增轉乘分段</button>
                                    </template>

                                    <textarea v-model="element.notes" placeholder="備註..." class="w-full h-20"></textarea>

                                    <div class="flex justify-between items-center pt-2 border-t border-sakura/10">
                                        <button @click="deleteItem(element.id)" class="text-red-400 text-xs font-bold">刪除</button>
                                        <button @click="saveItem(element)" class="bg-sakuraDeep text-white px-8 py-2 rounded-xl font-bold shadow-md">儲存並同步時間</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </draggable>

                <div class="fixed bottom-8 right-6 z-[60]">
                    <button @click="showAddMenu = !showAddMenu" class="w-14 h-14 bg-cocoa text-white rounded-full shadow-2xl flex items-center justify-center text-2xl transition-transform" :class="showAddMenu ? 'rotate-45' : ''">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <div v-if="showAddMenu" class="absolute bottom-20 right-0 flex flex-col gap-3 items-end">
                        <button @click="addItem('activity')" class="bg-white border-2 border-sakura px-6 py-3 rounded-2xl font-bold shadow-xl whitespace-nowrap">🌸 新增景點</button>
                        <button @click="addItem('transport')" class="bg-white border-2 border-blueSky px-6 py-3 rounded-2xl font-bold shadow-xl whitespace-nowrap">🚆 新增交通</button>
                    </div>
                </div>
            </div>

            <div v-show="activeTab === 'expenses'" class="p-4">
                <div class="bg-white rounded-[30px] p-6 border border-sakura/30 mb-6">
                    <p class="text-[10px] font-bold opacity-30 uppercase tracking-widest">Total Estimated Expenses</p>
                    <h2 class="text-3xl font-bold text-cocoa">HK$ {{ totalHKD }}</h2>
                </div>
                <canvas id="expenseChart" class="mb-20"></canvas>
            </div>

        </main>
    </div>
</div>

<script>
const { createApp, ref, computed, onMounted, watch } = Vue;

createApp({
    components: { draggable: window.vuedraggable },
    setup() {
        const isConfigured = ref(!!localStorage.getItem('sb_url'));
        const dbUrl = ref(localStorage.getItem('sb_url') || '');
        const dbKey = ref(localStorage.getItem('sb_key') || '');
        
        const activeTab = ref('schedule');
        const activeDate = ref('');
        const tripInfo = ref(JSON.parse(localStorage.getItem('trip_info') || '{"title":"首爾旅遊手帳","start_date":"2026-10-20","end_date":"2026-10-26"}'));
        const scheds = ref(JSON.parse(localStorage.getItem('scheds') || '[]'));
        const showAddMenu = ref(false);

        const tabs = [
            { id: 'schedule', label: '行程表', icon: 'fa-solid fa-calendar-days' },
            { id: 'nav', label: '導航器', icon: 'fa-solid fa-location-arrow' },
            { id: 'list', label: '必買清單', icon: 'fa-solid fa-basket-shopping' },
            { id: 'expenses', label: '記帳本', icon: 'fa-solid fa-wallet' }
        ];

        // --- Computed ---
        const tripDays = computed(() => {
            let start = new Date(tripInfo.value.start_date);
            let end = new Date(tripInfo.value.end_date);
            let days = [];
            while(start <= end) {
                let m = (start.getMonth()+1).toString().padStart(2,'0');
                let d = start.getDate().toString().padStart(2,'0');
                let week = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][start.getDay()];
                days.push({ date: start.toISOString().split('T')[0], label: `${m}.${d}(${week})` });
                start.setDate(start.getDate() + 1);
            }
            return days;
        });

        const dailyScheds = computed({
            get: () => scheds.value.filter(s => s.day_date === activeDate.value).sort((a,b) => a.order - b.order),
            set: (val) => {
                val.forEach((item, idx) => {
                    const origin = scheds.value.find(s => s.id === item.id);
                    if (origin) origin.order = idx;
                });
                recalcChain();
            }
        });

        // --- 骨牌時間引擎 ---
        const timeToMin = (t) => {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };
        const minToTime = (m) => {
            const h = Math.floor(m / 60) % 24;
            const min = m % 60;
            return `${h.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`;
        };

        const recalcChain = () => {
            let list = scheds.value.filter(s => s.day_date === activeDate.value).sort((a,b) => a.order - b.order);
            list.forEach((item, i) => {
                let startMin = timeToMin(item.start_time);
                let durMin = timeToMin(item.duration);
                item.end_time = minToTime(startMin + durMin);
                if (list[i+1]) {
                    list[i+1].start_time = item.end_time;
                }
            });
            saveLocal();
        };

        const formatTime = (item, field) => {
            let v = item[field].replace(/\D/g, '');
            if (v.length === 4) item[field] = `${v.slice(0,2)}:${v.slice(2,4)}`;
            recalcChain();
        };

        const hasGap = (i) => {
            const list = dailyScheds.value;
            return timeToMin(list[i].start_time) > timeToMin(list[i-1].end_time);
        };
        const getGap = (i) => {
            const list = dailyScheds.value;
            return timeToMin(list[i].start_time) - timeToMin(list[i-1].end_time);
        };

        // --- Actions ---
        const saveConfig = () => {
            localStorage.setItem('sb_url', dbUrl.value);
            localStorage.setItem('sb_key', dbKey.value);
            isConfigured.value = true;
        };

        const addItem = (type) => {
            const last = dailyScheds.value[dailyScheds.value.length-1];
            const startTime = last ? last.end_time : "09:00";
            scheds.value.push({
                id: Date.now(),
                type,
                day_date: activeDate.value,
                start_time: startTime,
                duration: "01:00",
                end_time: minToTime(timeToMin(startTime)+60),
                order: scheds.value.length,
                isEditing: true,
                segments: type === 'transport' ? [{mode:'地鐵', up:'', down:''}] : []
            });
            showAddMenu.value = false;
        };

        const saveItem = (item) => {
            item.isEditing = false;
            recalcChain();
        };

        const deleteItem = (id) => {
            if(confirm("確定刪除嗎？")) {
                scheds.value = scheds.value.filter(s => s.id !== id);
                saveLocal();
            }
        };

        const saveLocal = () => localStorage.setItem('scheds', JSON.stringify(scheds.value));

        const typeIcon = (e) => e.type === 'transport' ? 'fa-solid fa-train' : 'fa-solid fa-camera-retro';

        onMounted(() => {
            if (tripDays.value.length) activeDate.value = tripDays.value[0].date;
        });

        return {
            isConfigured, dbUrl, dbKey, saveConfig, activeTab, tabs, tripInfo, tripDays, activeDate, dailyScheds,
            addItem, saveItem, deleteItem, formatTime, showAddMenu, typeIcon, hasGap, getGap, onDragEnd: recalcChain
        };
    }
}).mount('#app');
</script>
</body>
</html>
