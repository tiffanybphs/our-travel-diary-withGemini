<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 旅遊手帳 - Our Travel Diary</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuedraggable@4.1.0/dist/vuedraggable.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: '#FFD1DC',
                        sakuraDeep: '#FFB7C5',
                        creamBg: '#FFFBF2', // 更淺的米黃，增加對比
                        transportBlue: '#E0F2F7', // 交通卡專用粉藍
                        cocoa: '#6D4C41',
                        accentPink: '#FF8AAB'
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #FFFBF2; color: #5D4037; }
        
        /* 修正圓角與描邊 */
        .card-activity { border: 2px solid #FFD1DC; background-color: #FFFFFF; border-radius: 1.5rem; }
        .card-transport { border: 2px solid #B0E0E6; background-color: #F0F9FF; border-radius: 1.5rem; }
        
        .header-image { background-image: url('header-bg(1).jpg'); background-size: cover; background-position: center; height: 220px; }
        
        /* 內容區塊上移與層次 */
        .main-container { margin-top: -30px; border-radius: 30px 30px 0 0; background-color: #FFFBF2; position: relative; z-index: 10; padding: 20px 16px; }

        /* 導航列 Sticky 修正 */
        .sticky-nav { position: sticky; top: 0; z-index: 50; background: rgba(255, 251, 242, 0.9); backdrop-filter: blur(8px); }
        .sticky-dates { position: sticky; top: 64px; z-index: 40; background: rgba(255, 251, 242, 0.9); backdrop-filter: blur(8px); padding: 10px 0; }

        /* 輸入框美化 - 拒絕藥丸形狀 */
        input, select, textarea { 
            border: 1.5px solid #E0D7D0; 
            border-radius: 12px; 
            padding: 10px 14px; 
            background: #FFFFFF;
            font-size: 14px;
        }
        input:focus { border-color: #FFB7C5; outline: none; box-shadow: 0 0 0 3px rgba(255, 183, 197, 0.2); }

        /* 滾動條隱藏 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 手帳風陰影 */
        .handbook-shadow { box-shadow: 4px 4px 0px rgba(255, 209, 220, 0.4); }
    </style>
</head>
<body>

<div id="app">
    <div v-if="!isConfigured" class="fixed inset-0 z-[100] bg-sakura flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-4xl shadow-xl w-full max-w-xs text-center border-4 border-white">
            <h1 class="text-xl font-bold text-cocoa mb-6">🌸 旅遊手帳設定</h1>
            <input v-model="dbUrl" placeholder="Supabase URL" class="w-full mb-3">
            <input v-model="dbKey" placeholder="Anon Key" type="password" class="w-full mb-6">
            <button @click="saveDbConfig" class="w-full bg-accentPink text-white font-bold py-3 rounded-2xl">開啟手帳</button>
        </div>
    </div>

    <div v-else>
        <header class="header-image relative">
            <div class="absolute inset-0 bg-gradient-to-t from-[#FFFBF2] via-transparent to-transparent"></div>
            <div class="absolute bottom-10 left-6">
                <h1 class="text-2xl font-bold text-cocoa drop-shadow-sm">{{ tripInfo.title || '我的旅程' }}</h1>
            </div>
        </header>

        <nav class="sticky-nav px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar border-b border-sakura/20">
            <button v-for="t in tabs" :key="t.id" @click="activeTab = t.id"
                class="flex-shrink-0 px-4 py-2 rounded-xl font-bold text-sm transition-all"
                :class="activeTab === t.id ? 'bg-sakura text-cocoa handbook-shadow' : 'text-gray-400'">
                <i :class="t.icon" class="mr-1.5"></i>{{ t.label }}
            </button>
        </nav>

        <main class="main-container">
            <div v-show="activeTab === 'schedule'">
                
                <div v-if="tripDays.length" class="sticky-dates flex gap-2 overflow-x-auto no-scrollbar mb-4">
                    <button v-for="day in tripDays" :key="day.date" @click="activeDate = day.date"
                        class="flex-shrink-0 px-4 py-2 rounded-2xl border-2 transition-all text-xs font-bold"
                        :class="activeDate === day.date ? 'border-sakura bg-sakura/20 text-cocoa' : 'border-transparent text-gray-400'">
                        {{ day.label }}
                    </button>
                </div>

                <div v-if="!tripInfo.start_date" class="text-center py-12 bg-white rounded-3xl border-2 border-dashed border-sakura">
                    <p class="text-gray-400 text-sm mb-4">還沒有行程呢，先設定日期吧！</p>
                    <button @click="activeTab = 'settings'" class="bg-sakura px-6 py-2 rounded-xl font-bold text-cocoa text-sm">去設定</button>
                </div>

                <draggable v-model="dailyList" item-key="id" group="sched" :delay="1000" @end="handleDragEnd" class="space-y-4">
                    <template #item="{ element, index }">
                        <div class="relative">
                            <div v-if="index > 0 && showGap(index)" class="flex justify-center -my-1">
                                <span class="bg-white px-3 py-0.5 rounded-full text-[10px] text-gray-400 border border-gray-100">
                                    ☕ 休息 {{ calcGap(index) }} 分鐘
                                </span>
                            </div>

                            <div :class="element.type === 'transport' ? 'card-transport' : 'card-activity'" class="p-4 handbook-shadow transition-all">
                                <div v-if="!element.isEditing" @click="element.isEditing = true">
                                    <div class="flex justify-between items-start mb-2">
                                        <div class="flex items-center gap-2">
                                            <span class="text-[11px] font-bold bg-white/80 px-2 py-0.5 rounded-lg border border-black/5">{{ element.start_time }}</span>
                                            <span v-if="element.tag" :class="tagColor(element.tag)" class="text-[10px] text-white px-2 py-0.5 rounded-md font-bold">{{ element.tag }}</span>
                                        </div>
                                        <i :class="element.type === 'transport' ? 'fa-solid fa-train-subway' : 'fa-solid fa-map-location-dot'" class="text-gray-300"></i>
                                    </div>
                                    
                                    <h3 class="font-bold text-cocoa text-base mb-1">
                                        {{ element.type === 'transport' ? `${element.from || '起始地'} ➜ ${element.to || '目的地'}` : element.title }}
                                    </h3>
                                    
                                    <p v-if="element.location" class="text-xs text-gray-500 flex items-center">
                                        <i class="fa-solid fa-location-arrow mr-1 opacity-50"></i> {{ element.location }}
                                    </p>
                                </div>

                                <div v-else class="space-y-3 pt-2">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="text-[10px] font-bold text-gray-400 mb-1 block ml-1">開始</label>
                                            <input v-model="element.start_time" placeholder="0900" class="w-full" @blur="formatTime(element, 'start_time')">
                                        </div>
                                        <div>
                                            <label class="text-[10px] font-bold text-gray-400 mb-1 block ml-1">時長</label>
                                            <input v-model="element.duration" placeholder="0130" class="w-full" @blur="formatTime(element, 'duration')">
                                        </div>
                                    </div>

                                    <div v-if="element.type === 'activity'">
                                        <input v-model="element.title" placeholder="景點/活動名稱" class="w-full mb-2">
                                        <div class="flex gap-2">
                                            <select v-model="element.tag" class="w-full">
                                                <option value="">選擇標籤</option><option>必吃</option><option>必買</option><option>必拍</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div v-else class="flex gap-2">
                                        <input v-model="element.from" placeholder="出發" class="w-1/2">
                                        <input v-model="element.to" placeholder="到達" class="w-1/2">
                                    </div>

                                    <div class="flex justify-between items-center pt-2">
                                        <button @click="removeSched(element.id)" class="text-red-300 text-xs"><i class="fa-solid fa-trash"></i> 刪除</button>
                                        <button @click="saveSched(element)" class="bg-accentPink text-white px-6 py-2 rounded-xl font-bold text-sm shadow-sm">儲存</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </draggable>
            </div>

            </main>

        <div class="fixed bottom-8 right-6 z-[60] flex flex-col items-end gap-3">
            <transition name="fade">
                <div v-if="showAddMenu" class="flex flex-col gap-2 mb-2">
                    <button @click="addQuick('activity')" class="bg-white border-2 border-sakura text-cocoa px-5 py-2 rounded-2xl font-bold text-sm shadow-xl">✨ 新景點</button>
                    <button @click="addQuick('transport')" class="bg-white border-2 border-transportBlue text-cocoa px-5 py-2 rounded-2xl font-bold text-sm shadow-xl">🚃 新交通</button>
                </div>
            </transition>
            <button @click="showAddMenu = !showAddMenu" class="w-14 h-14 bg-accentPink text-white rounded-2xl shadow-xl flex items-center justify-center text-xl transition-transform" :class="showAddMenu ? 'rotate-45' : ''">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <footer class="text-center py-10 opacity-20 text-[10px] tracking-widest">
            🌸 TIFFANY & BENJAMIN 🌸
        </footer>
    </div>
</div>

<script>
const { createApp, ref, computed, onMounted, watch } = Vue;

createApp({
    components: { draggable: window.vuedraggable },
    setup() {
        const isConfigured = ref(!!localStorage.getItem('sb_url'));
        const dbUrl = ref(localStorage.getItem('sb_url') || '');
        const dbKey = ref(localStorage.getItem('sb_key') || '');
        const activeTab = ref('schedule');
        const activeDate = ref('');
        const showAddMenu = ref(false);

        const tripInfo = ref(JSON.parse(localStorage.getItem('tripInfo') || '{"title":"我的東京之旅","start_date":"2024-05-01","end_date":"2024-05-05"}'));
        const scheds = ref(JSON.parse(localStorage.getItem('scheds') || '[]'));

        const tabs = [
            { id: 'schedule', label: '行程', icon: 'fa-solid fa-calendar-heart' },
            { id: 'list', label: '清單', icon: 'fa-solid fa-clipboard-list' },
            { id: 'expenses', label: '記帳', icon: 'fa-solid fa-wallet' },
            { id: 'nav', label: '設定', icon: 'fa-solid fa-gear' }
        ];

        // --- 核心邏輯 (日期與列表) ---
        const tripDays = computed(() => {
            if (!tripInfo.value.start_date) return [];
            let days = [];
            let curr = new Date(tripInfo.value.start_date);
            let end = new Date(tripInfo.value.end_date);
            const week = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            while(curr <= end) {
                const m = (curr.getMonth()+1).toString().padStart(2,'0');
                const d = curr.getDate().toString().padStart(2,'0');
                days.push({ date: curr.toISOString().split('T')[0], label: `${m}.${d}(${week[curr.getDay()]})` });
                curr.setDate(curr.getDate()+1);
            }
            if(!activeDate.value && days.length) activeDate.value = days[0].date;
            return days;
        });

        const dailyList = computed({
            get: () => scheds.value.filter(s => s.day_date === activeDate.value).sort((a,b) => a.order - b.order),
            set: (val) => {
                val.forEach((item, idx) => {
                    const found = scheds.value.find(s => s.id === item.id);
                    if(found) { found.order = idx; found.day_date = activeDate.value; }
                });
                saveLocal();
            }
        });

        // --- 格式化與計算 ---
        const formatTime = (item, field) => {
            let val = item[field].replace(/\D/g, '');
            if(val.length === 4) item[field] = `${val.slice(0,2)}:${val.slice(2,4)}`;
            recalcChain();
        };

        const timeToMin = (t) => {
            if(!t || !t.includes(':')) return 0;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };

        const minToTime = (min) => {
            const h = Math.floor(min / 60) % 24;
            const m = min % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        };

        const recalcChain = () => {
            const list = dailyList.value;
            list.forEach((item, i) => {
                let start = timeToMin(item.start_time);
                let dur = timeToMin(item.duration || "01:00");
                item.end_time = minToTime(start + dur);
                if(list[i+1]) list[i+1].start_time = item.end_time;
            });
            saveLocal();
        };

        const addQuick = (type) => {
            const last = dailyList.value[dailyList.value.length - 1];
            const start = last ? last.end_time : "09:00";
            scheds.value.push({
                id: Date.now(),
                type,
                title: type === 'activity' ? '新活動' : '',
                from: '', to: '',
                start_time: start,
                duration: '01:00',
                end_time: minToTime(timeToMin(start) + 60),
                day_date: activeDate.value,
                isEditing: true,
                order: dailyList.value.length,
                tag: ''
            });
            showAddMenu.value = false;
            saveLocal();
        };

        const saveSched = (item) => { item.isEditing = false; recalcChain(); };
        const removeSched = (id) => { if(confirm("刪除？")) { scheds.value = scheds.value.filter(s=>s.id!==id); saveLocal(); } };
        const saveLocal = () => { 
            localStorage.setItem('tripInfo', JSON.stringify(tripInfo.value));
            localStorage.setItem('scheds', JSON.stringify(scheds.value));
        };

        const showGap = (idx) => timeToMin(dailyList.value[idx].start_time) > timeToMin(dailyList.value[idx-1].end_time);
        const calcGap = (idx) => timeToMin(dailyList.value[idx].start_time) - timeToMin(dailyList.value[idx-1].end_time);
        
        const tagColor = (t) => {
            const colors = { '必吃': 'bg-[#FF8AAB]', '必買': 'bg-[#FFB7C5]', '必拍': 'bg-[#B0E0E6]' };
            return colors[t] || 'bg-gray-300';
        };

        const saveDbConfig = () => {
            localStorage.setItem('sb_url', dbUrl.value);
            localStorage.setItem('sb_key', dbKey.value);
            isConfigured.value = true;
        };

        return {
            isConfigured, dbUrl, dbKey, activeTab, tabs, tripInfo, tripDays, activeDate, dailyList,
            addQuick, saveSched, removeSched, formatTime, showAddMenu, showGap, calcGap, tagColor, saveDbConfig
        };
    }
}).mount('#app');
</script>
</body>
</html>
